name: 'action-notify-teams'
description: 'Send deployment notifications to Microsoft Teams via Incoming Webhook. Works with any project using GitHub Actions.'
branding:
  icon: 'bell'
  color: 'blue'
inputs:
  teams_webhook_url:
    description: 'The MS Teams Incoming Webhook URL'
    required: true
  status:
    description: 'Deployment status (start, success, failure)'
    required: true
  environment:
    description: 'Target environment (dev, stg, prod, etc.)'
    required: true
  project_name:
    description: 'Friendly Project name'
    required: false
    default: ${{ github.repository }}
  environment_url:
    description: 'The URL of the deployed environment'
    required: false
    default: ''
  message:
    description: 'Optional additional message'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Send Notification
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.teams_webhook_url }}
        STATUS: ${{ inputs.status }}
        ENV_NAME_RAW: ${{ inputs.environment }}
        PROJECT: ${{ inputs.project_name }}
        ENV_URL: ${{ inputs.environment_url }}
        MSG: ${{ inputs.message }}
        RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        BRANCH: ${{ github.ref_name }}
        ACTOR: ${{ github.actor }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action_notify.sh"
